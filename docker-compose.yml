services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apimonitor
      POSTGRES_PASSWORD: apimonitor
      POSTGRES_DB: apimonitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/postgres/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apimonitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./Docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: Docker/backend/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ROLE: api
      DATABASE_URL: postgresql://apimonitor:apimonitor@postgres:5432/apimonitor
      REDIS_HOST: redis

  backend-worker:
    build:
      context: .
      dockerfile: Docker/backend/Dockerfile.dev
    command: ["npm", "run", "start:worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgresql://apimonitor:apimonitor@postgres:5432/apimonitor
      REDIS_HOST: redis

  backend-scheduler:
    build:
      context: .
      dockerfile: Docker/backend/Dockerfile.dev
    command: ["npm", "run", "start:scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ROLE: scheduler
      DATABASE_URL: postgresql://apimonitor:apimonitor@postgres:5432/apimonitor
      REDIS_HOST: redis
    deploy:
      replicas: 1

  frontend:
    build:
      context: .
      dockerfile: Docker/frontend/Dockerfile.dev
    depends_on:
      - backend-api
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
